<!DOCTYPE html>
<html lang="en">
<head>

    <!-- ===== META ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== TITLE ===== -->
    <title>404 | Go Deeper Podcast-2024</title>

    <style>

        /* ===== RESET ===== */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body{
            width: 100%;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ===== CONTAINER ===== */
        .error-container{
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* ===== IMAGES ===== */
        .error-image{
            width: 100%;
            height: 100vh;

            object-fit: cover;

            display: none;
        }

        /* show desktop first */
        .desktop-img{
            display: block;
        }

        /* ===== MOBILE ===== */
        @media(max-width:768px){

            .desktop-img{
                display: none;
            }

            .mobile-img{
                display: block;
            }
        }

        /* ===== OVERLAY ===== */
        .overlay{
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            background: rgba(0,0,0,0.45);

            color: white;
            text-align: center;

            padding: 20px;
        }

        /* ===== LOGO ===== */
        .logo{
            width: 140px;
            margin-bottom: 20px;

            /* makes logo pop */
            filter: drop-shadow(0px 0px 10px rgba(255,255,255,0.2));
        }

        /* ===== TEXT ===== */
        .overlay h1{
            font-size: 6rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .overlay p{
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        /* ===== CONTACT BOX ===== */
        .contact-box{
            background: rgba(255,255,255,0.1);

            padding: 15px 25px;

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 12px;

            backdrop-filter: blur(10px);
        }

        .contact-box a{
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;

            transition: 0.3s ease;
        }

        .contact-box a:hover{
            opacity: 0.7;
        }

        /* ===== MOBILE TEXT ===== */
        @media(max-width:768px){

            .logo{
                width: 100px;
            }

            .overlay h1{
                font-size: 3.5rem;
            }

            .overlay p{
                font-size: 0.9rem;
            }

            .contact-box a{
                font-size: 1rem;
            }
        }

    </style>

</head>

<body>

    <!-- ===== ERROR CONTAINER ===== -->
    <div class="error-container">

    
        <!-- ===== OVERLAY CONTENT ===== -->
        <div class="overlay">

            <!-- logo -->
            <img 
                src="./graphics/imgs/logo_GD_wht.png"
                alt="Go deeper Pocast Logo"
                class="logo"
            >

            <!-- text -->
            <h1>404</h1>

            <p>
                The page you are looking for could not be found.
            </p>

            <!-- phone number -->
            <div class="contact-box">

                <!-- clickable phone number -->
                <a href="tel:+27793119969">
                    +27 79 311 9969
                </a>

                
            </div>
            <p>Call For technical help</p>

        </div>

    </div>

</body>
</html>
